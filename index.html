<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --ink: #1b1f24; --muted: #57606a;
    --accent: #1f497d; --accent-2: #2f6db3; --border: #d8dee4; --shadow: rgba(27,31,36,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #9198a1;
      --accent: #6ea8fe; --accent-2: #8ab4f8; --border: #30363d; --shadow: rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f8fa; --card: #ffffff; --ink: #1b1f24; --muted: #57606a;
    --accent: #1f497d; --accent-2: #2f6db3; --border: #d8dee4; --shadow: rgba(27,31,36,.08);
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #9198a1;
    --accent: #6ea8fe; --accent-2: #8ab4f8; --border: #30363d; --shadow: rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  header { margin-bottom: 2.25rem; }
  .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .78rem; }
  h1 { margin: .35rem 0 .5rem; font-size: 2rem; line-height: 1.15; }
  .lede { color: var(--muted); font-size: 1.05rem; max-width: 60ch; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 2rem; }
  a.card {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.25rem 1.25rem 1.35rem; box-shadow: 0 1px 2px var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px var(--shadow); border-color: var(--accent); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .num { font-size: .78rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .card h2 { margin: .35rem 0 .4rem; font-size: 1.12rem; }
  .card p { margin: 0; color: var(--muted); font-size: .93rem; }
  .card .go { margin-top: .9rem; color: var(--accent-2); font-weight: 600; font-size: .9rem; }
  .card .go::after { content: " →"; }
  .tool { border-style: dashed; }
  .tool .num { color: var(--accent-2); }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--border); padding-top: 1.25rem; }
  footer a { color: var(--accent-2); }
</style>
